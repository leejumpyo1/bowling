<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동해 B.C</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동해 B.C">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta property="og:title" content="동해 B.C">
<meta property="og:description" content="동해 볼링 동호회">
<meta property="og:image" content="https://leejumpyo1.github.io/bowling/logo_kakao.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec; --card:#ffffff; --ink:#1d1b22; --muted:#6d6874; --line:#e6e1da;
  --accent:#e2562f; --accent-ink:#fff; --accent-soft:#fde9e2;
  --good:#1f8a5b; --good-soft:#dff3e9; --bad:#c2372b; --bad-soft:#fbe3e0;
  --neutral-soft:#efece7; --lane:#1d2a44;
  --r:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121117; --card:#1c1b22; --ink:#f1eef4; --muted:#a19ca8; --line:#2e2c36;
    --accent:#ff7347; --accent-ink:#1a0f0b; --accent-soft:#3a2219;
    --good:#4cc68d; --good-soft:#173326; --bad:#ff7b6e; --bad-soft:#3a1b18;
    --neutral-soft:#26252d; --lane:#0c1322;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body:lang(ko){font-family:"Noto Sans KR",Manrope,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header.top{background:var(--lane);color:#fff;padding:18px 0 0}
header.top .wrap{padding-bottom:0}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:25px;margin:0;font-weight:900;letter-spacing:.02em;line-height:1}
.brand .logo-mark{height:50px;width:auto;flex:none;display:block;margin:-4px -2px -2px -6px}
.brand{gap:10px}
.brand .sub{font-size:12.5px;opacity:.7}
.brand .sp{flex:1}
.authbtn{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;cursor:pointer;margin-right:8px;white-space:nowrap}
.lang{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#fff;padding:4px 10px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:700;opacity:.7}
.lang button.on{background:#fff;color:var(--lane);opacity:1}
nav.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;color:#fff;opacity:.65;padding:10px 14px;font-weight:700;cursor:pointer;border-radius:12px 12px 0 0;white-space:nowrap;font-size:14px}
nav.tabs button.on{background:var(--bg);color:var(--ink);opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.card h3{font-size:15px;margin:0;font-weight:800}
.hint{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.step{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.kakao{background:#FEE500;border-color:#FEE500;color:#191919}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:15px;min-width:0;color:var(--ink)}
input.in:focus,select.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{border:1px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;font-size:14px}
.pill .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:10px}
.pill.on{background:var(--accent-soft);border-color:var(--accent);}
.pill.on .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.off{text-decoration:line-through;opacity:.55}
.rsvp{border:2px solid var(--accent)}
.rsvp-btns .btn{flex:1;justify-content:center;padding:13px;font-size:16px}
.rsvp-btns .btn.yes{background:var(--good);border-color:var(--good);color:#fff}
.rsvp-btns .btn.no{background:var(--bad);border-color:var(--bad);color:#fff}
tr.row-good td{background:var(--good-soft)}
tr.row-bad td{background:var(--bad-soft)}
.sumbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:560px){.sumbox{grid-template-columns:1fr}}
.sb{border-radius:12px;padding:12px}
.sb.good{background:var(--good-soft);border:1px solid var(--good)}
.sb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.sbh{font-weight:800;margin-bottom:6px}
.sb.good .sbh{color:var(--good)}.sb.bad .sbh{color:var(--bad)}
.si{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.si span{font-variant-numeric:tabular-nums;color:var(--muted)}
.acols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.acol{border-radius:12px;padding:10px 10px 8px;background:var(--bg);min-width:0}
.acol .ach{font-weight:800;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
.acol.y{background:var(--good-soft)} .acol.y .ach{color:var(--good)}
.acol.n{background:var(--bad-soft)} .acol.n .ach{color:var(--bad)}
.acol.u .ach{color:var(--muted)}
.aname{font-size:14px;padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .av{color:var(--muted);font-size:12px;font-weight:500}
.count{font-size:13px;font-weight:700;color:var(--muted)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.team{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.team .th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.team .th b{font-size:14px}
.team .meta{font-size:12px;color:var(--muted)}
.team ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.team li{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px dashed var(--line);font-size:14px}
.team li:nth-child(-n+2){border-top:0}
.team li{flex-wrap:wrap;row-gap:0;min-width:0}
.team li select{margin-left:auto}
.team li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team li select{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px}
.t0{--tc:#e2562f}.t1{--tc:#2f6fe2}.t2{--tc:#1f8a5b}.t3{--tc:#9b51e0}.t4{--tc:#d4a20b}.t5{--tc:#0e9aa7}.t6{--tc:#c2185b}.t7{--tc:#6d4c41}
.team{border-top:4px solid var(--tc,var(--line))}
.tag{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--tc,var(--line));flex:none}
table.sc{width:100%;border-collapse:collapse;margin-top:10px}
table.sc th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.sc td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.sc tr:last-child td{border-bottom:0}
table.sc td:first-child{white-space:nowrap}
table.sc .num{text-align:right;font-variant-numeric:tabular-nums}
table.sc input.in{width:84px;text-align:right;padding:7px 9px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.zero{background:var(--neutral-soft);color:var(--muted)}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.gcard{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.banner{border-radius:12px;padding:12px 14px;margin-top:16px;font-size:14px;background:var(--accent-soft);border:1px solid var(--accent)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .ico{font-size:34px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{display:none}
.switch .tr{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.15s}
.switch .tr::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + .tr{background:var(--accent)}
.switch input:checked + .tr::after{left:19px}
.inactive{opacity:.5}
.modal-bg{position:fixed;inset:0;background:rgba(10,10,20,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal h3{margin:0 0 10px;font-size:17px}
.modal textarea{width:100%;min-height:200px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}.grid2 .in{width:100%;min-width:0;box-sizing:border-box}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.big{font-size:28px}table.sc input.in{width:70px}}
.rule{background:var(--bg);border-radius:12px;padding:12px;font-size:13.5px;margin-top:12px}
.rule b{font-weight:800}
.pos{color:var(--good)}.neg{color:var(--bad)}
</style>
</head>

/* ---------------- i18n ---------------- */
const I18N = {
 ko:{
  app:'동해 B.C', sub:'참석 조사 · 라인 배정 · 점수 기록',
  tab_game:'게임', tab_members:'회원', tab_history:'기록', tab_kassa:'회비', tab_settings:'설정',

/* ---------------- state ---------------- */
const DEF = {threshold:20, amount:1000, autoAvg:true, lastN:10, teamCount:3, time:'18:30', place:'', gamesPerNight:3, mode:'evening', perLane:5};
const autoK = n => Math.max(1, Math.ceil(n / Math.max(1, num(S.settings.perLane)||5)));

function arrOf(v){ if(Array.isArray(v)) return v.map(num); if(num(v)!=null) return [num(v)]; return []; }
const played = a => a.filter(v=>v!=null);
const nightAvg = a => { const p=played(a); return p.length ? p.reduce((x,y)=>x+y,0)/p.length : null; };
function draftArr(g,id){ const base=arrOf(g.scores?.[id]); const n=Math.max(G(), base.length); const out=[];
  for(let i=0;i<n;i++){ const k=g.id+'_'+id+'_'+i; out.push(k in S.sd ? num(S.sd[k]) : (base[i]??null)); } return out; }
function deltaArr(a, avg){ const p=played(a); if(!p.length || avg==null) return 0;
  if(S.settings.mode==='each') return p.reduce((s,v)=>s+delta(v,avg),0); return delta(nightAvg(a), avg); }
const laneLabel = i => `${2*i+1}/${2*i+2}`;
const S = {

const money = n => { const v=Math.round(n||0); return (v>0?'+':v<0?'−':'') + Math.abs(v).toLocaleString(lang==='ko'?'ko-KR':'ru-RU') + ' ₩'; };

/* average for a member, using only finished games before `beforeKey` */
function avgFor(id, beforeKey){
  const m = member(id); if(!m) return null;
  const base = num(m.base);

  const sc = doneGames().filter(g=>!beforeKey || gameKey(g) < beforeKey).map(g=>nightAvg(arrOf(g.scores?.[id]))).filter(v=>v!=null);
  const last = sc.slice(-N);
  if(!last.length) return base;
  const sum = last.reduce((a,b)=>a+b,0);
  if(base==null) return Math.round(sum/last.length*10)/10;
  const fill = N - last.length;
  return Math.round((sum + base*fill)/N*10)/10;
}

/* ---------------- teams ---------------- */
function genTeams(g, k, randomize){
  const ids = attendees(g);
  k = Math.max(1, Math.min(k, ids.length));
  const known = ids.map(id=>avgIn(g,id)).filter(v=>v!=null); const fb = known.length ? known.reduce((a,b)=>a+b,0)/known.length : 150;
  const A = id => avgIn(g,id) ?? fb;
  const n = ids.length;
  const sizes = Array.from({length:k},(_,i)=>Math.floor(n/k)+(i<n%k?1:0));
  const spread = teams => { const ms = teams.map(tm=>tm.reduce((a,id)=>a+A(id),0)/(tm.length||1)); return Math.max(...ms)-Math.min(...ms); };
  const one = noise => {
    const pl = ids.map(id=>({id, a:A(id)+(Math.random()-.5)*noise})).sort((x,y)=>y.a-x.a);
    const teams = sizes.map(()=>[]); const sums = sizes.map(()=>0);
    for(const p of pl){ let b=-1; for(let i=0;i<k;i++){ if(teams[i].length>=sizes[i]) continue; if(b<0 || sums[i]/Math.max(1,teams[i].length) < sums[b]/Math.max(1,teams[b].length) || (teams[i].length<teams[b].length && sums[i]<=sums[b])) b=i; } teams[b].push(p.id); sums[b]+=p.a; }
    // local swap improvement on true averages
    let best = spread(teams), improved = true, guard=0;
    while(improved && guard++<60){ improved=false;
      for(let i=0;i<k;i++) for(let j=i+1;j<k;j++) for(let x=0;x<teams[i].length;x++) for(let y=0;y<teams[j].length;y++){
        const a=teams[i][x], b=teams[j][y]; teams[i][x]=b; teams[j][y]=a;
        const s=spread(teams); if(s < best-1e-9){ best=s; improved=true; } else { teams[i][x]=a; teams[j][y]=b; }
      }
    }
    return {teams, spread:best};
  };
  let res;
  if(!randomize) res = one(0);
  else { const c = Array.from({length:40},()=>one(30)); const b=Math.min(...c.map(x=>x.spread)); const ok=c.filter(x=>x.spread<=b+3); res = ok[Math.floor(Math.random()*ok.length)]; }
  const map = {}; res.teams.forEach((tm,i)=>tm.forEach(id=>map[id]=i));
  return {map, k};
}

/* projected next-year average: mean of all individual games played this calendar year (updates after every game) */
function seasonAvg(id, year){
  const y = String(year); let sum = 0, n = 0, nights = 0;
  doneGames().forEach(g=>{ if(isDinner(g) || !String(g.date||'').startsWith(y)) return;
    const p = played(arrOf(g.scores?.[id])); if(!p.length) return; nights++;
    const w = p.length===1 ? (Number(S.settings.gamesPerNight)||3) : 1; /* only the night average is known → counts as a full night */
    p.forEach(v=>{ sum += v*w; n += w; }); });
  return n ? {avg: sum/n, games: n, nights} : null;
}

  let h = !isAdmin() ? '' : `<div class="card"><h2>${esc(t('add_member'))}</h2>
    <div class="row" style="margin-top:10px;align-items:flex-end">
      <label class="f grow">${esc(t('name'))}<input class="in" id="nm_name" data-d="nm_name" value="${esc(dv('nm_name'))}"></label>
      <label class="f" style="width:150px">${esc(t('base_avg'))}<input class="in" type="number" id="nm_avg" data-d="nm_avg" value="${esc(dv('nm_avg'))}" inputmode="numeric"></label>
      <button class="btn pri" data-act="addMember" ${ro()}>＋ ${esc(t('add'))}</button>
    </div></div>`;
  h += `<div class="card"><div class="row between"><h2>${esc(t('members_h'))}</h2><span class="count">${ms.length}</span></div>`;
  if(!ms.length) h += `<div class="empty">👥</div>`;
  else {
    const yr = new Date().getFullYear();
    h += `<div class="hint" style="margin-top:4px">${esc(t('proj_hint', yr, yr+1))}</div>`;
    h += `<table class="sc"><thead><tr><th>${esc(t('name'))}</th><th class="num">${esc(t('current_avg'))}</th><th class="num">${esc(t('proj_col', yr+1))}</th><th class="num">${esc(t('games'))}</th><th></th></tr></thead><tbody>`;
    ms.forEach(m=>{ const st=memberStats(m.id); const pj=seasonAvg(m.id, yr); const ca=curAvg(m.id);
      const dlt = pj && ca!=null ? Math.round((pj.avg-ca)*10)/10 : null;
      h += `<tr class="${m.active===false?'inactive':''}"><td><b>${esc(m.name)}</b>${num(m.base)!=null&&S.settings.autoAvg?`<div class="hint">${esc(t('base_avg'))}: ${esc(m.base)}</div>`:''}</td>
        <td class="num"><b>${fa(ca)}</b></td>
        <td class="num">${pj?`<b>${fa(pj.avg)}</b>${dlt!=null&&dlt!==0?`<div style="font-size:11.5px" class="${dlt>0?'pos':'neg'}">${dlt>0?'▲':'▼'} ${Math.abs(dlt)}</div>`:''}`:'<span class="hint">—</span>'}</td>
        <td class="num">${st.games}</td>
        <td class="num">${isAdmin()?`<button class="btn ghost sm" data-act="editMember" data-id="${m.id}">✎</button>`:''}</td></tr>`;
    });
    h += `</tbody></table>`;
  }
  return h + `</div>`;
}

function resultsRows(g){
  const ids = Object.keys(g.scores||{}).filter(id=>played(arrOf(g.scores[id])).length);
  return ids.map(id=>({id, name:mname(id), arr:played(arrOf(g.scores[id])), score:nightAvg(arrOf(g.scores[id])), avg:avgIn(g,id), d:Number(g.deltas?.[id]||0), team:g.team?.[id]}))
    .sort((a,b)=>b.score-a.score);
}

      const att = attendees(g); const open = S.histOpen===g.id;

        ${open?`<div class="pills">${att.map(id=>`<span class="pill on"><span class="dot">✓</span>${esc(mname(id))}</span>`).join('')}</div>${isAdmin()?`<div class="row" style="margin-top:14px"><span class="grow"></span><button class="btn sm ghost" data-act="reopen" data-id="${g.id}">↺ ${esc(t('reopen'))}</button><button class="btn sm ghost danger" data-act="delGame" data-id="${g.id}">🗑 ${esc(t('delete'))}</button></div>`:''}`:''}</div>`;

        ${rows.map((r,i)=>`<tr class="${r.d>0?'row-good':r.d<0?'row-bad':''}"><td>${i<3?`<span style="font-size:17px">${MEDALS[i]}</span> `:`<span class="hint" style="display:inline-block;min-width:22px;font-size:12px">${i+1}</span>`}${r.team!=null&&g.teamCount?`<span class="tag t${r.team%8}"></span> `:''}${esc(r.name)}<div class="hint" style="font-size:12px;white-space:nowrap">${r.arr.join(' · ')}</div></td><td class="num"><b>${fa(r.score)}</b></td><td class="num hint">${fa(r.avg)}</td><td class="num">${diffTag(r.score, r.avg)}</td><td class="num"><button class="btn ghost sm" data-act="card" data-id="${g.id}" data-m="${r.id}" title="📸">📸</button></td></tr>`).join('')}</tbody></table>`;
      h += summaryHtml(rows.map(r=>({name:r.name, arr:r.arr, avg:r.avg})));
      if(g.teamCount) h += teamsHtml(g,false);
      h += `<div class="row" style="margin-top:14px"><button class="btn sm" data-act="copyResults" data-id="${g.id}">📋 ${esc(t('copy_results'))}</button>${kakaoBtn('kRes', g.id)}<span class="grow"></span>
        ${isAdmin()?`<button class="btn sm ghost" data-act="reopen" data-id="${g.id}">↺ ${esc(t('reopen'))}</button><button class="btn sm ghost danger" data-act="delGame" data-id="${g.id}">🗑 ${esc(t('delete'))}</button>`:''}</div>`;
    }
    return h + `</div>`;
  }).join('');
}

/* ---------------- 회비 · 지출 (admin) ---------------- */
const CATS = ['game','prize','dinner','event','avg','etc'];
const CAT_ICON = {game:'🎳', prize:'🎁', dinner:'🍽️', event:'🏆', avg:'⭐', etc:'📦', inc:'💵'};
const won = n => Math.round(Number(n)||0).toLocaleString('ko-KR') + '원';
const ymNow = () => today().slice(0,7);
const ymOf = d => String(d||'').slice(0,7);
const ymAdd = (ym, n) => { let [y,m] = ym.split('-').map(Number); m += n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+String(m).padStart(2,'0'); };
const ymLabel = ym => { const [y,m] = ym.split('-'); return t('ym', y, Number(m)); };
const mLabel = ym => t('mon', Number(ym.slice(5)));
const ymRange = (a, b) => { const out=[]; let x=a; while(x<=b && out.length<240){ out.push(x); x=ymAdd(x,1); } return out; };
const feeDocs = () => S.ledger.filter(e=>e.type==='fees');
const feeDoc = y => S.ledger.find(e=>e.id==='fee-'+y);
const cashEntries = () => S.ledger.filter(e=>e.type==='exp' || e.type==='inc');
const feeDues = y => Number((feeDoc(y)||{}).dues ?? (feeDocs().slice(-1)[0]||{}).dues ?? 30000) || 30000;
const feeAccount = () => { const d = feeDocs().filter(x=>x.account).sort((a,b)=>a.year<b.year?1:-1)[0]; return d ? d.account : ''; };
function feeCell(ym, id){ const d = feeDoc(ym.slice(0,4)); const v = d && d.paid && d.paid[id] && d.paid[id][String(Number(ym.slice(5)))]; return v || null; }
const isPaid = v => v && typeof v==='object';
function feeIds(yms){ // active members + anyone with a record in these months
  const ids = new Set(S.members.filter(m=>m.active!==false).map(m=>m.id));
  yms.forEach(ym=>{ const d=feeDoc(ym.slice(0,4)); if(d&&d.paid) Object.keys(d.paid).forEach(id=>{ if(feeCell(ym,id)) ids.add(id); }); });
  return [...ids].filter(id=>member(id)).sort((a,b)=>byName(member(a),member(b)));
}
function monthFlow(ym){
  let fee=0, n=0, inc=0, exp=0; const cat={};
  const d = feeDoc(ym.slice(0,4)); const mk = String(Number(ym.slice(5)));
  if(d && d.paid) Object.values(d.paid).forEach(r=>{ const v = r && r[mk]; if(isPaid(v)){ fee += Number(v.a)||0; n++; } });
  cashEntries().forEach(e=>{ if(ymOf(e.date)!==ym) return; const a=Number(e.amount)||0;
    if(e.type==='inc') inc += a; else { exp += a; const c = CATS.includes(e.cat)?e.cat:'etc'; cat[c] = (cat[c]||0) + a; } });
  return {fee, n, inc, exp, cat, net: fee+inc-exp};
}
function allYms(){
  const s = new Set();
  feeDocs().forEach(d=>Object.values(d.paid||{}).forEach(r=>Object.keys(r||{}).forEach(k=>{ if(isPaid(r[k])) s.add(d.year+'-'+String(k).padStart(2,'0')); })));
  cashEntries().forEach(e=>{ if(e.date) s.add(ymOf(e.date)); });
  return [...s].sort();
}
const carryTotal = () => feeDocs().reduce((a,d)=>a+(Number(d.carry)||0), 0);
const balanceBefore = ym => carryTotal() + allYms().filter(x=>x<ym).reduce((a,x)=>a+monthFlow(x).net, 0);
const balanceNow = () => carryTotal() + allYms().reduce((a,x)=>a+monthFlow(x).net, 0);
const entryDay = e => String(e.date||'').length>=10 ? Number(e.date.slice(8,10))+t('day_sfx') : '';

    <div class="stat"><div class="k">${esc(t('fee_year_out', y))}</div><div class="v neg">−${esc(won(yout))}</div></div></div></div>`;

    <div class="hint">${esc(adm?t('fee_dues_hint', won(feeDues(y))):t('fee_dues_hint_ro', won(feeDues(y))))}</div>
    <div class="list" style="margin-top:6px">${ids.map(id=>{ const v=feeCell(ym,id);
      const st = isPaid(v) ? `<span class="hint" style="font-size:12px">${v.d?esc(fmtDate(v.d)):''}</span><button class="pill on" ${adm?`data-act="feeTap" data-m="${id}"`:'disabled style="cursor:default"'}><span class="dot">✓</span>${esc(won(v.a))}</button>`
        : v==='pause' ? `<button class="pill" ${adm?`data-act="feeTap" data-m="${id}"`:'disabled style="cursor:default"'} style="opacity:.6">⏸ ${esc(t('fee_pause'))}</button>`
        : `<button class="pill" ${adm?`data-act="feeTap" data-m="${id}"`:'disabled style="cursor:default"'} style="border-color:var(--bad,#d33);color:var(--bad,#d33)"><span class="dot"></span>${esc(t('fee_unpaid'))}</button>`;
      return `<div class="it"><span class="grow"><b>${esc(mname(id))}</b></span>${st}</div>`; }).join('')}</div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap"><span class="hint grow">${esc(t('fee_month_sum', won(f.fee)))}</span>
      ${unpaid.length&&adm?`<button class="btn sm" data-act="feeRemind">📋 ${esc(t('fee_remind', unpaid.length))}</button>`:''}</div></div>`;

  // 2) cash entries
  const es = cashEntries().filter(e=>ymOf(e.date)===ym).sort((a,b)=>(a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:(a.createdAt||0)-(b.createdAt||0));
  h += `<div class="card"><div class="row between"><h2>🧾 ${esc(t('fee_exp_h'))}</h2><span class="hint">−${esc(won(f.exp))}${f.inc?` · +${esc(won(f.inc))}`:''}</span></div>
    <div class="list" style="margin-top:6px">${es.length?es.map(e=>`<div class="it"><span class="hint" style="width:34px;font-size:12px">${esc(entryDay(e))}</span><span>${CAT_ICON[e.type==='inc'?'inc':(e.cat||'etc')]||'📦'}</span><span class="grow" style="font-size:14px">${esc(e.item||'—')}</span><b class="${e.type==='inc'?'pos':'neg'}" style="white-space:nowrap">${e.type==='inc'?'+':'−'}${esc(won(e.amount))}</b>${adm?`<button class="btn ghost sm" data-act="delCash" data-id="${e.id}">✕</button>`:''}</div>`).join(''):`<div class="empty" style="padding:10px">—</div>`}</div>
    ${adm?`<div class="grid2" style="margin-top:12px">
      <label class="f">${esc(t('date'))}<input class="in" type="date" id="fe_date" data-d="fe_date" value="${esc(dv('fe_date', ym===ymNow()?today():ym+'-01'))}"></label>
      <label class="f">${esc(t('amount'))}<input class="in" type="number" id="fe_amt" data-d="fe_amt" value="${esc(dv('fe_amt'))}" inputmode="numeric" placeholder="157500"></label>
    </div>
    <label class="f" style="margin-top:10px">${esc(t('fee_item'))}<input class="in" id="fe_item" data-d="fe_item" value="${esc(dv('fe_item'))}" placeholder="${esc(t('fee_item_ph'))}"></label>
    <div class="pills" style="margin-top:10px">${CATS.map(c=>`<button class="pill ${dv('fe_cat','game')===c?'on':''}" data-act="feCat" data-v="${c}">${CAT_ICON[c]} ${esc(t('cat_'+c))}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn pri" data-act="addCash" data-v="exp">− ${esc(t('fee_add_exp'))}</button><button class="btn" data-act="addCash" data-v="inc">＋ ${esc(t('fee_add_inc'))}</button></div>`:''}</div>`;

  // 3) report
  const r = S.d.rep_from || ymAdd(ymNow(), -5), r2 = S.d.rep_to || ymNow();
  const opts = sel => { const all = allYms(); const lo = all[0] || ymNow(); return ymRange(lo < ymAdd(ymNow(),-24) ? lo : ymAdd(ymNow(),-24), ymAdd(ymNow(),1)).reverse().map(x=>`<option value="${x}" ${x===sel?'selected':''}>${esc(ymLabel(x))}</option>`).join(''); };
  h += `<div class="card"><h2>📊 ${esc(t('rep_h'))}</h2>
    <div class="pills">${['m0','m1','h1','h2','y0','y1'].map(k=>`<button class="pill" data-act="rep" data-v="${k}">${esc(t('rep_'+k))}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px;align-items:flex-end;flex-wrap:wrap">
      <label class="f grow">${esc(t('rep_from'))}<select class="in" data-d="rep_from">${opts(r)}</select></label>
      <label class="f grow">${esc(t('rep_to'))}<select class="in" data-d="rep_to">${opts(r2)}</select></label>
      <button class="btn pri" data-act="rep" data-v="custom">${esc(t('rep_go'))}</button></div>
    <div class="row" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><span class="hint grow">${esc(t('xl_hint'))}</span><button class="btn" data-act="feeXlsx" data-v="${y}">📥 ${esc(t('xl_btn', y))}</button></div></div>`;

/* ---- Excel (same layout as 연간회비 / 월별내역) ---- */
function feeTables(y){
  y = String(y); const fd = feeDoc(y) || {}; const yms = ymRange(y+'-01', y+'-12');
  const open = balanceBefore(y+'-01');
  const ids = feeIds(yms);
  const H = ['NO.','이 름','납입액','이월회비']; for(let m=1;m<=12;m++) H.push(m+'월',''); H.push('비 고');
  const acc = fd.account || feeAccount();
  const A = [[` ■ ${y}년 동해모임 회비 내역` + (acc?` ※ 계좌번호 : ${acc} ※`:'')], H];
  const msum = Array(12).fill(0); let all = 0;
  const pushRow = (no, name, cells, carry) => { const row=[no, name, 0, carry||'']; let tot=Number(carry)||0;
    cells.forEach((c,i)=>{ if(c && typeof c==='object'){ row.push(c.a, c.d||''); tot+=c.a; msum[i]+=c.a; } else row.push('', c==='pause'?'일시중지':''); });
    row[2]=tot; all+=tot; row.push(''); A.push(row); };
  let no=1;
  ids.forEach(id=>pushRow(no++, mname(id), yms.map(ym=>{ const v=feeCell(ym,id); return isPaid(v)?{a:Number(v.a)||0, d:v.d||''}:v; })));
  const incs = {}; cashEntries().filter(e=>e.type==='inc' && String(e.date||'').startsWith(y)).forEach(e=>{ const k=e.item||'기타 수입'; (incs[k]=incs[k]||Array(12).fill(null)); const i=Number(String(e.date).slice(5,7))-1; const c=incs[k][i]||{a:0,d:''}; c.a+=Number(e.amount)||0; if(String(e.date).length>=10) c.d=e.date; incs[k][i]=c; });
  Object.keys(incs).forEach(k=>pushRow(no++, k, incs[k]));
  if(open) { const r=['', '이월 잔액', open, open]; for(let i=0;i<24;i++) r.push(''); r.push(''); A.push(r); all+=open; }
  const T=['합계','', all, open||'']; msum.forEach(s=>T.push(s,'')); T.push(''); A.push(T);
  const M = [['', `${y}년 월 세부내역`], [], ['', '구분','회비 입금액','지출액','지출 주요 내용','잔액'], ['', '이월', open, '', '', open]];
  let bal=open, tin=open, tout=0;
  yms.forEach(ym=>{ const f=monthFlow(ym); bal+=f.net; tin+=f.fee+f.inc; tout+=f.exp;
    const desc = cashEntries().filter(e=>e.type==='exp' && ymOf(e.date)===ym).sort((a,b)=>(a.date||'')<(b.date||'')?-1:(a.createdAt||0)-(b.createdAt||0)).map(e=>`${e.item||''} : ${(Number(e.amount)||0).toLocaleString('ko-KR')}원`).join('\n');
    M.push(['', mLabel(ym), f.fee+f.inc, f.exp||'', desc, bal]); });
  M.push(['', '합계', tin, tout, '잔액', bal]);
  return {annual:A, monthly:M};
}

function repPeriod(k){
  const now = ymNow(), y = Number(now.slice(0,4));
  if(k==='m0') return [now, now];
  if(k==='m1'){ const p=ymAdd(now,-1); return [p,p]; }
  if(k==='h1') return [y+'-01', y+'-06'];
  if(k==='h2') return [y+'-07', y+'-12'];
  if(k==='y0') return [y+'-01', y+'-12'];
  if(k==='y1') return [(y-1)+'-01', (y-1)+'-12'];
  let a = S.d.rep_from || ymAdd(now,-5), b = S.d.rep_to || now; if(a>b) [a,b]=[b,a]; return [a,b];
}
function buildReport(from, to){
  const yms = ymRange(from, to); const now = ymNow();
  const open = balanceBefore(from);
  const months = yms.map(ym=>({ym, ...monthFlow(ym)}));
  let run = open; months.forEach(m=>{ run += m.net; m.bal = run; });
  const tot = months.reduce((a,m)=>{ a.fee+=m.fee; a.n+=m.n; a.inc+=m.inc; a.exp+=m.exp; CATS.forEach(c=>a.cat[c]=(a.cat[c]||0)+(m.cat[c]||0)); return a; }, {fee:0,n:0,inc:0,exp:0,cat:{}});
  const ids = feeIds(yms);
  const due = yms.filter(ym=>ym<=now);
  const unpaid = ids.map(id=>({id, ms: due.filter(ym=>!feeCell(ym,id) && (member(id).active!==false))})).filter(x=>x.ms.length);
  const perMember = ids.map(id=>({id, sum: yms.reduce((a,ym)=>{ const v=feeCell(ym,id); return a + (isPaid(v)?Number(v.a)||0:0); },0)}));
  const entries = cashEntries().filter(e=>{ const m=ymOf(e.date); return m>=from && m<=to; }).sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);
  return {from, to, yms, open, close: open + tot.fee + tot.inc - tot.exp, months, tot, ids, unpaid, perMember, entries};
}

function cardData(g, id){
  const arr = played(arrOf(g.scores?.[id])); if(!arr.length) return null;
  const all = Object.keys(g.scores||{}).map(k=>({k, n:nightAvg(arrOf(g.scores[k]))})).filter(r=>r.n!=null).sort((a,b)=>b.n-a.n);
  const a = avgIn(g,id), n = nightAvg(arr);
  return {name:mname(id), date:g.date, arr, top:Math.max(...arr), n, a, diff: a==null?null:n-a,
    d: g.status==='done' ? Number(g.deltas?.[id]||0) : deltaArr(arr,a), rank: all.findIndex(r=>r.k===id)+1, of: all.length};
}
function rr(x, X, Y, W, H, R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
async function drawCard(cd){
  try{ await Promise.all([document.fonts.load('800 200px Manrope'), document.fonts.load('800 60px "Noto Sans KR"'), document.fonts.load('500 30px "Noto Sans KR"')]); }catch(e){}
  const W=1080, H=1350, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const KR='"Noto Sans KR", Manrope, sans-serif', NUM='Manrope, "Noto Sans KR", sans-serif';
  const up = cd.diff==null ? null : cd.diff>=0;
  const accent = up==null ? '#ff7347' : up ? '#2ee59d' : '#ff5c5c';
  // background
  const bg = x.createLinearGradient(0,0,W,H); bg.addColorStop(0,'#0b1020'); bg.addColorStop(1,'#1b2742'); x.fillStyle=bg; x.fillRect(0,0,W,H);
  const glow = x.createRadialGradient(W*0.78,H*0.36,20,W*0.78,H*0.36,620); glow.addColorStop(0, up===false?'rgba(255,92,92,.28)':'rgba(46,229,157,.26)'); glow.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=glow; x.fillRect(0,0,W,H);
  x.save(); x.globalAlpha=.05; x.strokeStyle='#fff'; x.lineWidth=2; for(let i=-H;i<W;i+=60){ x.beginPath(); x.moveTo(i,H); x.lineTo(i+H,0); x.stroke(); } x.restore();
  // header
  x.fillStyle='#fff'; x.font='800 44px '+KR; x.textBaseline='alphabetic'; x.fillText('🎳 동해 B.C', 72, 120);
  x.fillStyle='rgba(255,255,255,.6)'; x.font='500 34px '+KR; x.textAlign='right'; x.fillText(fmtDate(cd.date,true), W-72, 120); x.textAlign='left';
  // name
  x.fillStyle='#fff'; x.font='800 76px '+KR; x.fillText(cd.name, 72, 270);
  // hero
  x.fillStyle=accent; x.font='800 34px '+NUM; x.fillText('BEST GAME', 76, 370);
  x.fillStyle='#fff'; x.font='800 300px '+NUM; x.fillText(String(cd.top), 60, 640);
  // badges
  let bx=76; const badge=(txt,col,fg)=>{ x.font='800 36px '+KR; const w=x.measureText(txt).width+56; rr(x,bx,690,w,72,36); x.fillStyle=col; x.fill(); x.fillStyle=fg; x.fillText(txt,bx+28,739); bx+=w+18; };
  if(cd.top>=200) badge('🔥 200 CLUB','#ffcf33','#1a1200');
  if(cd.d>0) badge('🏆 평균 +'+S.settings.threshold+' 달성','#2ee59d','#04291b');
  if(cd.rank>=1 && cd.rank<=3 && cd.of>1) badge(['🥇','🥈','🥉'][cd.rank-1]+' 오늘 '+cd.rank+'위','#ffffff','#111');
  // PnL-style diff
  if(cd.diff!=null){
    const pct = cd.a ? (cd.diff/cd.a*100) : 0, sg = cd.diff>=0?'+':'−';
    const dy = bx>76 ? 0 : -50;
    x.fillStyle=accent; x.font='800 120px '+NUM; x.fillText(sg+Math.abs(pct).toFixed(1)+'%', 72, 920+dy);
    x.fillStyle='rgba(255,255,255,.65)'; x.font='500 34px '+KR; x.fillText('평균 대비 '+sg+(Math.round(Math.abs(cd.diff)*10)/10)+'점', 76, 975+dy);
  }
  // stat boxes
  const stats = [...cd.arr.map((v,i)=>[(i+1)+'G', String(v)]), ['당일 평균', String(Math.round(cd.n*10)/10)], ['개인 평균', cd.a==null?'—':String(Math.round(cd.a*10)/10)], ['순위', cd.rank+' / '+cd.of]];
  const cols = 3, bw=(W-144-2*24)/cols, bh=118; 
  stats.slice(0,6).forEach((st,i)=>{ const cx=72+(i%cols)*(bw+24), cy=1010+Math.floor(i/cols)*(bh+20);
    rr(x,cx,cy,bw,bh,22); x.fillStyle='rgba(255,255,255,.07)'; x.fill();
    x.fillStyle='rgba(255,255,255,.55)'; x.font='500 28px '+KR; x.fillText(st[0], cx+26, cy+44);
    x.fillStyle='#fff'; x.font='800 46px '+NUM; x.fillText(st[1], cx+26, cy+98); });
  // footer
  const site = /^https?:/.test(location.protocol) && location.host ? location.host + location.pathname.replace(/index\.html$/,'') : '';
  if(site){ x.fillStyle='rgba(255,255,255,.4)'; x.font='500 26px '+NUM; x.fillText(site, 76, H-30); }
  return c;
}
async function openCard(gid, id){
  const g = S.games.find(x=>x.id===gid); const cd = g && cardData(g,id); if(!cd) return;
  S.modal = {type:'card', loading:true}; renderModal();
  const c = await drawCard(cd);
  const url = c.toDataURL('image/png');
  const blob = await new Promise(r=>c.toBlob(r,'image/png'));
  const file = new File([blob], 'bowling_'+cd.date+'_'+cd.name+'.png', {type:'image/png'});
  S.modal = {type:'card', img:url, file, cd, gid}; renderModal();
}
/* ---------------- lane table image (라인 배정 표) ---------------- */
const LANE_COLORS = ['#ff7347','#3a9bff','#2ee59d','#ffcf33','#c77dff','#ff5c8a','#4dd6e8','#a3e048'];
function logoImage(){
  const el = document.querySelector('.logo-mark'); if(!el) return Promise.resolve(null);
  let s = el.outerHTML.replace(/style="fill:var\(--lane\)"/g, 'fill="#1d2a44"').replace('<svg ', '<svg width="480" height="380" ');
  if(!/xmlns=/.test(s)) s = s.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
  return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s); });
}
async function drawLanes(g){
  try{ await Promise.all([document.fonts.load('900 60px "Noto Sans KR"'), document.fonts.load('800 40px "Noto Sans KR"'), document.fonts.load('500 28px "Noto Sans KR"'), document.fonts.load('800 40px Manrope')]); }catch(e){}
  const KR='"Noto Sans KR", Manrope, sans-serif', NUM='Manrope, "Noto Sans KR", sans-serif';
  const att = attendees(g), k = g.teamCount||2;
  const lanes = [...Array(k)].map((_,i)=>{ const ids = laneIds(g,i);
    const kn = ids.map(id=>avgIn(g,id)).filter(v=>v!=null); return {i, ids, ma: kn.length ? Math.round(kn.reduce((a,b)=>a+b,0)/kn.length) : null}; }).filter(l=>l.ids.length);
  const W=1080, PAD=44, GAP=18, per = lanes.length<=4 ? Math.max(lanes.length,1) : Math.ceil(lanes.length/2);
  const colW = (W-2*PAD-(per-1)*GAP)/per, ROW=74, HEADH=118, TOP=300;
  const blocks=[]; for(let i=0;i<lanes.length;i+=per) blocks.push(lanes.slice(i,i+per));
  const blockH = b => HEADH + Math.max(...b.map(l=>Math.ceil(l.ids.length/2)))*ROW + 16;
  const H = TOP + blocks.reduce((a,b)=>a+blockH(b)+GAP,0) + 90;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const bg=x.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#16203a'); bg.addColorStop(1,'#0b1020'); x.fillStyle=bg; x.fillRect(0,0,W,H);
  x.fillStyle='#1d2a44'; x.fillRect(0,0,W,250);
  const logo = await logoImage(); let tx = PAD;
  if(logo){ x.drawImage(logo, PAD-10, 34, 230, 182); tx = PAD+240; }
  x.textBaseline='alphabetic'; x.textAlign='left';
  x.fillStyle='#fff'; x.font='900 64px '+KR; x.fillText(t('lanes_img_title'), tx, 118);
  x.fillStyle='rgba(255,255,255,.75)'; x.font='600 36px '+KR; x.fillText(fmtDate(g.date,true) + (g.time?' · '+g.time:''), tx, 172);
  x.fillStyle='rgba(255,255,255,.55)'; x.font='500 30px '+KR; x.fillText(t('lanes_img_sub', att.length, lanes.length), tx, 218);
  let y = TOP;
  blocks.forEach(b=>{ const bh = blockH(b);
    b.forEach((l,j)=>{ const cx = PAD + j*(colW+GAP), col = LANE_COLORS[l.i % LANE_COLORS.length];
      rr(x,cx,y,colW,bh,24); x.fillStyle='rgba(255,255,255,.06)'; x.fill();
      rr(x,cx,y,colW,HEADH-10,24); x.fillStyle=col; x.fill(); x.fillRect(cx, y+40, colW, HEADH-50);
      x.fillStyle='#0b1020'; x.font='900 40px '+KR; x.fillText(t('team', laneLabel(l.i)), cx+22, y+56);
      x.font='700 25px '+KR; x.fillStyle='rgba(11,16,32,.75)'; x.fillText((l.ma!=null? t('avg_short')+' '+l.ma : '')+' · '+l.ids.length+t('ppl_short'), cx+22, y+92);
      pairsOf(l.ids).forEach((pr,r)=>{ const ry = y + HEADH + r*ROW;
        if(r>0){ x.fillStyle='rgba(255,255,255,.08)'; x.fillRect(cx+18, ry-4, colW-36, 2); }
        let fs = colW<230?28:34; x.font='800 '+fs+'px '+KR;
        while(fs>20 && pr.reduce((a,id)=>a+x.measureText(mname(id)).width,0) > colW-44-24){ fs-=2; x.font='800 '+fs+'px '+KR; }
        x.fillStyle='#fff'; x.textAlign='left'; x.fillText(mname(pr[0]), cx+22, ry+46);
        if(pr[1]){ x.textAlign='right'; x.fillText(mname(pr[1]), cx+colW-22, ry+46); x.textAlign='left'; } });
    });
    y += bh + GAP; });
  const site = /^https?:/.test(location.protocol) && location.host ? location.host + location.pathname : '';
  x.fillStyle='rgba(255,255,255,.35)'; x.font='500 24px '+NUM; x.fillText(site || '동해 B.C', PAD, H-36);
  return c;
}

/* ---------------- texts ---------------- */
function pollText(g){ return isDinner(g) ? t('poll_dinner', fmtDate(g.date,true), (g.time?', '+g.time:'') + (g.place?', '+g.place:'')) : t('poll_text', fmtDate(g.date,true), (g.time?', '+g.time:'')); }
function laneIds(g, i){ const lo = v => v==null ? 1e9 : v;
  return attendees(g).filter(id=>g.team?.[id]===i).sort((a,b)=>lo(avgIn(g,a))-lo(avgIn(g,b))); }
const pairsOf = ids => { const out=[]; for(let j=0;j<ids.length;j+=2) out.push(ids.slice(j,j+2)); return out; };
function teamsText(g){
  const att=attendees(g), k=g.teamCount||2; let s=t('teams_text', fmtDate(g.date,true))+'\n';
  for(let i=0;i<k;i++){ const ids=att.filter(id=>g.team?.[id]===i); const kn = ids.map(id=>avgIn(g,id)).filter(v=>v!=null); const ma = kn.length?Math.round(kn.reduce((a,b)=>a+b,0)/kn.length):0;
    s += `\n${laneLabel(i)}\n` + pairsOf(laneIds(g,i)).map(p=>p.map(mname).join(' ')).join('\n') + '\n'; }
  return s;
}
function resultsText(g){
  const rows = resultsRows(g);
  let s = t('results_text', fmtDate(g.date,true)) + '\n';
  rows.forEach((r,i)=>{ s += `\n${i<3?MEDALS[i]:(i+1)+'.'} ${r.name} — ⌀${fa(r.score)} (${r.arr.join('/')})${r.d>0?' 🟢':r.d<0?' 🔴':''}`; });
  return s;
}

document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.d){ S.d[el.dataset.d] = el.type==='checkbox' ? el.checked : el.value; if(el.type==='checkbox') render(); }
  if(el.dataset.score){ S.sd[el.dataset.score+'_'+el.dataset.m+'_'+el.dataset.i] = el.value; liveRow(el); }
});
function liveRow(el){
  const g = S.games.find(x=>x.id===el.dataset.score); if(!g) return;
  const cell = document.getElementById('res_'+g.id+'_'+el.dataset.m); if(!cell) return;
  const arr = draftArr(g, el.dataset.m), a = avgIn(g, el.dataset.m);
  cell.innerHTML = resCell(arr, a);
  const d = played(arr).length ? deltaArr(arr, a) : 0;
  const row = document.getElementById('row_'+g.id+'_'+el.dataset.m); if(row) row.className = d>0?'row-good':d<0?'row-bad':'';
  const sm = document.getElementById('sum_'+g.id); if(sm) sm.innerHTML = summaryHtml(attendees(g).map(id=>({name:mname(id), arr:draftArr(g,id), avg:avgIn(g,id)})));
}
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.score){
    const gid=el.dataset.score, mid=el.dataset.m; const g=S.games.find(x=>x.id===gid); if(!g) return;
    saveScores(g, [mid]);
  }
  if(el.id==='ocrFile' && el.files && el.files[0]){ runOcr(el.files[0]); }

    const gid=el.dataset.move, mid=el.dataset.m;
    write('games/'+gid, ()=>gdoc(gid).update({team:{[mid]: Number(el.value)}}));
  }
});
document.addEventListener('click', e=>{

  if(act==='bgclose'){ if(e.target===el) closeModal(); return; }

    case 'card': openCard(id, el.dataset.m); break;

    case 'mclose': closeModal(); break;
    case 'mok': { const fn=S.modal&&S.modal.onOk; closeModal(); fn&&fn(); break; }
    case 'createGame': {
      const date = dv('ng_date', today()); if(!date) return;
      const ref = S.db.collection('games').doc();
      const kind = dv('ng_kind','bowling')==='dinner' ? 'dinner' : 'bowling';
      const body = {date, kind, place: kind==='dinner' ? (dv('ng_place')||'').trim() : '', time:dv('ng_time', DEFAULT_TIME), status:'open', attending:{}, team:{}, teamCount:0, scores:{}, createdAt:Date.now()};
      S.gameSel = ref.id; ['ng_date','ng_time','ng_kind','ng_place'].forEach(k=>delete S.d[k]);

    case 'att': { const mid=el.dataset.m; const on=!g.attending?.[mid]; write('games/'+id, ()=>gdoc(id).update({attending:{[mid]:on}})); break; }
    case 'attAll': case 'attNone': { const att={}; S.members.filter(m=>m.active!==false).forEach(m=>att[m.id]=act==='attAll'?true:null); write('games/'+id, ()=>gdoc(id).update({attending:att})); break; }

    case 'gen': case 'shuffle': {
      const k = Math.round(num(dv('tc_'+id)) ?? (g.teamCount || autoK(attendees(g).length)));
      const r = genTeams(g, Math.max(1,Math.min(8,k)), act==='shuffle'); delete S.d['tc_'+id];
      write('games/'+id, ()=>gdoc(id).update({team:r.map, teamCount:r.k})); break; }
    case 'copyTeams': copyText(teamsText(g)); break;

      const att = attendees(g);

const normName = s => String(s||'').replace(/\s+/g,'').toLowerCase();
function matchToken(tok){
  const T = normName(tok).replace(/[^가-힣a-zа-яё]/g,'');
  if(T.length<2) return null;
  const ms = S.members;
  let m = ms.find(x=>normName(x.name)===T);
  if(m) return m;
  // receipt prints a shorter name, e.g. "알렉스" for "이알렉스"
  const part = ms.filter(x=>{ const n=normName(x.name); return T.length>=2 && (n.endsWith(T) || n.startsWith(T)) && n.length-T.length<=1; });
  if(part.length===1) return part[0];
  // OCR typo: same length (3+), one wrong character
  const fz = ms.filter(x=>{ const n=normName(x.name); if(n.length<3||n.length!==T.length) return false; let d=0; for(let i=0;i<n.length;i++) if(n[i]!==T[i]) d++; return d<=1; });
  return fz.length===1 ? fz[0] : null;
}
function matchMember(line){
  const L = normName(line);
  const ms = S.members.slice().sort((a,b)=>(b.name||'').length-(a.name||'').length);
  let m = ms.find(m=>L.includes(normName(m.name)));
  if(m) return m;
  for(const tok of String(line).split(/[^가-힣A-Za-zА-Яа-яЁё]+/)){ const x = matchToken(tok); if(x) return x; }
  return null;
}
function parseTokens(text, n){
  // Walk the whole text as a token stream: NAME num num num NAME num num num …
  // Handles receipts where OCR puts the whole score block on one line and drops a name.
  const toks = String(text).split(/[\s|]+/).filter(Boolean);
  const seq = [];                       // {m, nums:[...]}
  const order = [];                     // members in order of first appearance (top block order)
  for(let i=0;i<toks.length;i++){
    const tk = toks[i];
    if(/^\d+$/.test(tk)){ if(seq.length) seq[seq.length-1].nums.push(Number(tk)); continue; }
    const m = matchToken(tk);
    if(m){ seq.push({m, nums:[]}); if(!order.includes(m.id)) order.push(m.id); }
    else if(seq.length) seq[seq.length-1].closed = true, seq.push({m:null, nums:[]});
  }
  const res = {}; const orphan = [];
  const ok = a => a.length===n && a.every(v=>v>=0 && v<=300);
  const explicit = new Set(seq.filter(e=>e.m && e.nums.length===n && ok(e.nums)).map(e=>e.m.id));
  seq.forEach(e=>{ if(e.m && e.nums.length===n && ok(e.nums)) res[e.m.id] = e.nums; });
  seq.forEach(e=>{
    if(!e.m || e.nums.length<=n || e.nums.length % n) return;
    const chunks = []; for(let i=0;i<e.nums.length;i+=n) chunks.push(e.nums.slice(i,i+n));
    if(!chunks.every(ok)) return;
    // the extra triples must belong to the very next people in receipt order whose names OCR dropped
    const k = order.indexOf(e.m.id);
    const next = order.slice(k+1, k+chunks.length);
    if(next.length === chunks.length-1 && !next.some(id=>explicit.has(id))){
      if(!res[e.m.id]) res[e.m.id] = chunks[0];
      next.forEach((id,i)=>{ if(!res[id]) res[id] = chunks[i+1]; });
    } else if(chunks.length===2 && !res[e.m.id]){
      // one name was dropped by OCR and that person is not in our list: keep the first triple, report the other
      res[e.m.id] = chunks[0];
      orphan.push(chunks[1]);
    }
  });
  res.__orphan = orphan;
  return res;
}
function parsePaste(g, text){
  const n = G(); const best = {}; const unknown = [];
  const tk = parseTokens(text, n);
  const orphan = tk.__orphan || []; delete tk.__orphan;
  Object.keys(tk).forEach(id=>{ best[id] = {id, sc:tk[id], exact:true}; });
  orphan.forEach(a=>unknown.push('? ' + a.join(' ')));
  const isScore = v => v>=30 && v<=300;      // lane no., games count, rank (<30) and TOT (>300) are not game scores
  const lines = text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  lines.forEach(line=>{
    const allNums = (line.match(/\d+/g)||[]).map(Number);
    const nums = allNums.filter(isScore);
    const words = line.replace(/[\d|:.,;\-]+/g,' ').trim();
    if(!words || !nums.length) return;
    const m = matchMember(line);
    if(!m){ if(nums.length===n) unknown.push(words); return; }
    const exact = nums.length===n;
    const looksLikeSummary = allNums.length > n + 1;   // "이름 LN 구분 Game TOT TOP AVR R" row
    if(looksLikeSummary && !exact) return;
    if(nums.length>n) return;
    if(!best[m.id] || (exact && !best[m.id].exact)) best[m.id] = {id:m.id, sc:nums, exact};
  });
  // OCR may output the names column and the numbers column separately: zip name-only lines with number-only rows
  const nameLines = lines.filter(l=>!/\d/.test(l)).map(matchMember).filter(Boolean);
  const numRows = lines.filter(l=>/^[\d\s|.,]+$/.test(l)).map(l=>(l.match(/\d+/g)||[]).map(Number)).filter(a=>a.length===n && a.every(isScore));
  if(numRows.length && nameLines.length >= numRows.length){
    nameLines.slice(-numRows.length).forEach((m,i)=>{ if(!best[m.id] || !best[m.id].exact) best[m.id] = {id:m.id, sc:numRows[i], exact:true}; });
  }
  // drop partial matches that are clearly not scores of all games (keep only if user typed fewer games by hand)
  // receipt names that are not in the member list
  (String(text).match(/(^|\n)\s*([가-힣]{2,4})\s+\d{1,2}\s+회원/g)||[]).forEach(x=>{ const nm=x.trim().split(/\s+/)[0]; if(!matchToken(nm) && !unknown.includes(nm)) unknown.push(nm); });
  return {found:Object.values(best), unknown};
}

async function apiPost(body){
  const r = await fetch(API_URL, {method:'POST', body:JSON.stringify(body)}); // text/plain → без CORS preflight
  const j = await r.json();

  return j;

const netQ = {};
function send(op, coll, id, data){
  // 1) мгновенно применяем изменение на экране
  const c = LOCAL[coll] || (LOCAL[coll] = {});
  if(op==='set') c[id] = clone(data);
  else if(op==='update'){ if(!c[id]) c[id] = {}; deepMerge(c[id], clone(data)); }
  else delete c[id];
  syncState(); render();
  // 2) отправляем на сервер в фоне, по очереди для одного документа
  const key = coll + '/' + id;
  pending++;
  const p = (netQ[key] || Promise.resolve()).catch(()=>{}).then(()=>apiPost({action:op, token:TOKEN, coll, id, data}));
  netQ[key] = p;
  return p.then(()=>{ pending--; }, async e=>{ pending--; if(e.code==='auth') logout(true); lastJson=''; await loadAll().catch(()=>{}); render(); throw e; });
}
const ref = (coll,id) => ({id, set:d=>send('set',coll,id,d), update:d=>send('update',coll,id,d), delete:()=>send('delete',coll,id)});
const API_DB = {
  collection: c => ({ doc: id => ref(c, id || newId()), add: async d => { const id = newId(); await send('set', c, id, d); return {id}; } }),
  doc: p => { const [c,id] = p.split('/'); return ref(c,id); }
};

  handlePendingRsvp();
  setInterval(async ()=>{
    if(document.visibilityState!=='visible' || pending) return;
    try{ const ch = await loadAll(); if(S.stale || ch){ S.stale = false; render(); } }
    catch(e){ if(!S.stale){ S.stale = true; render(); } }
  }, 20000);
})();
</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:' && /github\.io$/.test(location.hostname)){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }</script>
